name: Pages

# site/ 를 notipet.sanghak.kr 로 배포한다 (저장소 설정: Pages 소스 = GitHub Actions, 사용자 도메인 notipet.sanghak.kr)
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 브라우저가 예전 스크립트·CSS를 쓰지 않도록 주소에 커밋 번호를 붙인다 (Cloudflare 브라우저 캐시 4시간)
      - run: grep -rl '?v=dev' site | xargs sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
